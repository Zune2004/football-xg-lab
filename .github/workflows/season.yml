# Daily: add newly finished top-5-league matches to xg/season/matches.csv (TheSportsDB free API, ~2.5 s per request).
name: Season data
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 xg/season_fetch.py
      - name: Commit if changed
        run: |
          git config user.name "season-data"; git config user.email "season-data@users.noreply.github.com"
          git add xg/season/matches.csv
          git diff --cached --quiet || (git commit -m "season data $(date -u +%F)" && git push)
